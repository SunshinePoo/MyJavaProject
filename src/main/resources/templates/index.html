<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple UI Program</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: #f0f0f0;
            border-radius: 8px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }

        input[type="text"] {
            padding: 10px;
            font-size: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: Arial, sans-serif;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.5);
        }

        button {
            padding: 10px 20px;
            background-color: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #5568d3;
        }

        button:active {
            transform: scale(0.98);
        }

        .output-container {
            padding: 15px;
            border-radius: 4px;
            text-align: center;
            font-style: italic;
            font-size: 13px;
            min-height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .output-default {
            background-color: #e8e8e8;
            color: #666;
        }

        .output-success {
            background-color: #e8f5e9;
            color: #006400;
            border: 1px solid #4caf50;
        }

        .output-error {
            background-color: #ffebee;
            color: #c80000;
            border: 1px solid #f44336;
        }

        #outputLabel {
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Simple UI Program</h1>
        <form method="post" action="/display">
            <label for="textInput">Enter text:</label>
            <input type="text" id="textInput" name="text" placeholder="Type something...">
            <button type="submit" id="displayBtn">Display</button>
        </form>

        <div id="outputLabel" class="output-container output-default" th:class="${'output-container ' + (outputColor == 'success' ? 'output-success' : outputColor == 'error' ? 'output-error' : 'output-default')}">
            <span th:if="${output}" th:text="${output}">Output will appear here</span>
            <span th:unless="${output}">Output will appear here</span>
        </div>
    </div>
</body>
</html>
